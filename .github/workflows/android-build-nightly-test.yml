name: Android Build ( Plus )

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g., v2.0.0 or nightly)'
        required: true
        type: string
        default: 'nightly'
      build_type:
        description: 'Build type (only for single‑core; dual‑core always release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Build flavor (Github or Play)'
        required: false
        type: choice
        options:
          - Github
          - Play
        default: 'Github'
      core_type:
        description: 'Type of core to build'
        required: true
        type: choice
        options:
          - single   # one core (default page size)
          - dual     # two cores (4k + 16k) using a dedicated script
        default: 'single'

permissions:
  contents: write   # required for creating tags and releases

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platforms/android   # all steps run here by default

    steps:
      # ===== 1. Checkout =====
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # ===== 2. Setup Java, Android SDK, NDK, CMake, Rust =====
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null || true

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      # ===== 3. Third‑party dependencies (shaderc) =====
      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      # ===== 4. Discord SDK (optional) =====
      - name: Set up Discord SDK
        run: |
          echo "DISCORD_SDK_DIR=${{ github.workspace }}/discord-sdk" >> $GITHUB_ENV
          # Add download/install commands here if needed

      # ===== 5. Grant execute permission for gradlew =====
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== 6. Decode signing keystores for dual‑core builds =====
      - name: Decode rotation signing secrets (dual‑core only)
        if: github.event.inputs.core_type == 'dual'
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.ROTATION_DEBUG_KS }}" | base64 -d > "$HOME/.android/debug.keystore"
          echo "${{ secrets.ROTATION_RELEASE_KS }}" | base64 -d > "$HOME/.android/release.keystore"
          echo "${{ secrets.ROTATION_LINEAGE }}" | base64 -d > "$HOME/.android/lineage"
          chmod 600 "$HOME/.android/"*.keystore "$HOME/.android/lineage"

      # ===== 7. Set versionName in build.gradle.kts (single‑core only) =====
      - name: Set versionName in build.gradle.kts (single-core)
        if: github.event.inputs.core_type == 'single'
        run: |
          sed -i 's/versionName\s*=\s*".*"/versionName = "${{ github.event.inputs.versionName }}"/' app/build.gradle.kts

      # ===== 8. Build the APK =====
      - name: Build with Gradle (single-core)
        if: github.event.inputs.core_type == 'single'
        id: build_single
        run: |
          FLAVOR="${{ github.event.inputs.flavor }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          FLAVOR_LOWER="$(echo ${FLAVOR} | tr '[:upper:]' '[:lower:]')"
          BUILD_TYPE_LOWER="$(echo ${BUILD_TYPE} | tr '[:upper:]' '[:lower:]')"
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          BUILD_TYPE_CAP="$(echo ${BUILD_TYPE:0:1} | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          echo "FLAVOR_LOWER=${FLAVOR_LOWER}" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE_LOWER=${BUILD_TYPE_LOWER}" >> $GITHUB_OUTPUT
          ./gradlew :app:assemble${FLAVOR_CAP}${BUILD_TYPE_CAP} --stacktrace --no-daemon
        env:
          DISCORD_SDK_DIR: ${{ env.DISCORD_SDK_DIR }}

      - name: Build dual-core (4k+16k) using dedicated script
        if: github.event.inputs.core_type == 'dual'
        id: build_dual
        working-directory: platforms/android   # explicit (already inherited)
        run: |
          export VN="${{ github.event.inputs.versionName }}"
          export VC="$(date +'%Y%m%d')"   # or use ${{ github.run_number }}
          export FLAVOR="${{ github.event.inputs.flavor }}"
          export PROF="${PROF:-$PWD/pgo/armsx2.profdata}"
          chmod +x ci-nightly-dualcore.sh
          ./ci-nightly-dualcore.sh
        env:
          ROTATION_DEBUG_KS: ${{ runner.home }}/.android/debug.keystore
          ROTATION_RELEASE_KS: ${{ runner.home }}/.android/release.keystore
          ROTATION_LINEAGE: ${{ runner.home }}/.android/lineage
          ROTATION_DEBUG_ALIAS: ${{ secrets.ROTATION_DEBUG_ALIAS }}
          ROTATION_DEBUG_PASS: ${{ secrets.ROTATION_DEBUG_PASS }}
          ROTATION_RELEASE_KEY_ALIAS: ${{ secrets.ROTATION_RELEASE_KEY_ALIAS }}
          ROTATION_RELEASE_KS_PASS: ${{ secrets.ROTATION_RELEASE_KS_PASS }}
          ROTATION_RELEASE_KEY_PASS: ${{ secrets.ROTATION_RELEASE_KEY_PASS }}

      # ===== 9. Determine APK output path =====
      - name: Set APK path for single-core
        if: github.event.inputs.core_type == 'single'
        id: apk_path_single
        run: |
          FLAVOR_LOWER="${{ steps.build_single.outputs.FLAVOR_LOWER }}"
          BUILD_TYPE_LOWER="${{ steps.build_single.outputs.BUILD_TYPE_LOWER }}"
          APK_DIR="app/build/outputs/apk/${FLAVOR_LOWER}/${BUILD_TYPE_LOWER}"
          echo "APK_DIR=${APK_DIR}" >> $GITHUB_ENV
          echo "APK_PATTERN=${APK_DIR}/*.apk" >> $GITHUB_ENV

      - name: Set APK path for dual-core
        if: github.event.inputs.core_type == 'dual'
        id: apk_path_dual
        run: |
          APK_DIR="app/build/outputs/apk/nightly"
          echo "APK_DIR=${APK_DIR}" >> $GITHUB_ENV
          echo "APK_PATTERN=${APK_DIR}/*.apk" >> $GITHUB_ENV

      # ===== 10. Setup GitHub CLI for release management =====
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # ===== 11. Delete previous release and tag (if any) =====
      - name: Get previous release
        id: get_release
        run: |
          previous_release=$(gh release list --limit 1 --json tagName -q '.[].tagName')
          echo "previous_release=$previous_release" >> $GITHUB_ENV

      - name: Delete previous release
        if: env.previous_release != ''
        run: |
          gh release delete ${{ env.previous_release }} --yes

      - name: Check if previous tag exists
        id: check_tag
        run: |
          if [ ! -z "${{ env.previous_release }}" ] && git rev-parse ${{ env.previous_release }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_ENV
          else
            echo "tag_exists=false" >> $GITHUB_ENV
          fi

      - name: Delete previous tag
        if: env.tag_exists == 'true'
        run: |
          git tag -d ${{ env.previous_release }}
          git push --delete origin ${{ env.previous_release }}

      # ===== 12. Get short SHA =====
      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # ===== 13. Create new tag and release =====
      - name: Create Git Tag
        id: create_tag
        run: |
          VERSION_NAME="${{ github.event.inputs.versionName }}"
          TAG="${VERSION_NAME}-build.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Build ${{ github.run_number }} (${VERSION_NAME})"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: "${{ github.event.inputs.versionName }} build ${{ github.run_number }}"
          body: |
            ## ARMSX2 Android Build
            - **Core type**: ${{ github.event.inputs.core_type }}
            - **Flavor**: ${{ github.event.inputs.flavor }}
            - **Build type**: ${{ github.event.inputs.build_type }} (only for single-core)
            - **Build number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - **Short SHA**: ${{ env.short_sha }}
            - **Triggered by**: ${{ github.actor }}
          files: |
            ${{ env.APK_PATTERN }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
