name: Android Build (Legacy DualCore)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g., v2.0.0)'
        required: true
        type: string
        default: 'nightly'
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Build flavor (Github, Play)'
        required: false
        type: choice
        options:
          - Github
          - Play
        default: 'Github'

permissions:
  contents: write

jobs:
  android:
    name: Android APK (Dual Core)
    runs-on: ubuntu-24.04
    # Removed 'continue-on-error: true' – fail fast on errors
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install NDK 29 and CMake (fail if installation fails – removed '|| true')
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Set versionName in build.gradle.kts
        run: |
          VN="${{ github.event.inputs.versionName }}"
          sed -i 's/versionName = ".*"/versionName = "'"$VN"'"/' app/build.gradle.kts

      # Ensure the Discord SDK is present (adjust download URL as needed)
      - name: Set up Discord SDK
        run: |
          echo "DISCORD_SDK_DIR=${{ github.workspace }}/discord-sdk" >> $GITHUB_ENV
          # Uncomment and adapt if the SDK must be downloaded:
          # wget -q -O discord-sdk.zip https://dl-game-sdk.discordapp.net/latest/discord_game_sdk.zip && unzip -q discord-sdk.zip -d ${{ github.workspace }}/discord-sdk

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== Build the legacy APK (dual‑core + PGO) =====
      - name: Build Legacy APK (dual‑core, PGO)
        id: build
        run: |
          set -e  # Exit on any error
          ROOT_DIR="${{ github.workspace }}/platforms/android"
          GRADLE="$ROOT_DIR/gradlew"
          cd "$ROOT_DIR"

          # Fixed parameters for the legacy target (safe for all ARMv8.0 devices)
          MINSDK=26
          NDK_VER="29.0.14206865"
          MARCH="armv8-a"
          MARCH_EXTRA="-moutline-atomics"

          # Version info – use input directly
          VN="${{ github.event.inputs.versionName }}"
          VC="${{ github.run_number }}"

          # PGO profile path (adjust if your build produces it elsewhere)
          PROF="$ROOT_DIR/pgo/armsx2.profdata"

          if [[ -f "$PROF" ]]; then
            PGO_ARGS=(-Parmsx2.pgo=optimize -Parmsx2.pgoProfile="$PROF")
            PGO_ENABLED="enabled"
          else
            PGO_ARGS=(-Parmsx2.pgo=none)
            PGO_ENABLED="disabled"
            echo "WARNING: PGO profile not found at $PROF – building without PGO (slower core)." >&2
          fi
          echo "pgo_enabled=${PGO_ENABLED}" >> $GITHUB_OUTPUT

          # Determine build tools directory once
          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort -V | tail -1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          # Flavor handling
          FLAVOR_INPUT="${{ github.event.inputs.flavor }}"
          FLAVOR_LOWER="$(echo "$FLAVOR_INPUT" | tr '[:upper:]' '[:lower:]')"
          FLAVOR_CAP="$(echo "$FLAVOR_INPUT" | sed 's/.*/\u&/')"
          echo "Selected flavor: $FLAVOR_INPUT (task: assemble${FLAVOR_CAP}Release)"

          # Working directory for assembling the two cores
          WORK="$ROOT_DIR/app/build/nightly-dualcore/${FLAVOR_LOWER}"
          rm -rf "$WORK"
          mkdir -p "$WORK/lib-stage/lib/arm64-v8a"

          FINAL_APK="ARMSX2-${VN}-${FLAVOR_LOWER}-legacy-armv8.0-sdk26.apk"
          OUTDIR="$ROOT_DIR/app/build/outputs/apk/legacy"
          mkdir -p "$OUTDIR"

          # Helper for file size
          fsizef() { stat -c%s "$1" 2>/dev/null || stat -f%z "$1"; }

          build_core() {
            local ps="$1" ln="$2"
            echo "=== Building core: $ln (page size $ps) for flavor $FLAVOR_INPUT ==="

            "$GRADLE" -p "$ROOT_DIR" ":app:assemble${FLAVOR_CAP}Release" \
              -Parmsx2.hostPageSize="$ps" \
              -Parmsx2.nativeLibName="$ln" \
              -Parmsx2.minSdk="$MINSDK" \
              -Parmsx2.ndkVersion="$NDK_VER" \
              -Parmsx2.march="$MARCH" \
              -Parmsx2.marchExtra="$MARCH_EXTRA" \
              "${PGO_ARGS[@]}" \
              -Parmsx2.versionCode="$VC" \
              -Parmsx2.versionName="$VN" \
              --stacktrace

            BUILT="$ROOT_DIR/app/build/outputs/apk/${FLAVOR_LOWER}/release/app-${FLAVOR_LOWER}-release.apk"
            [[ -f "$BUILT" ]] || { echo "FATAL: Gradle did not produce an APK for $ln" >&2; exit 1; }
            unzip -l "$BUILT" "lib/arm64-v8a/lib${ln}.so" >/dev/null \
              || { echo "FATAL: lib${ln}.so missing from APK" >&2; exit 1; }

            cp -f "$BUILT" "$WORK/base-${ln}.apk"
            unzip -p "$BUILT" "lib/arm64-v8a/lib${ln}.so" > "$WORK/lib-stage/lib/arm64-v8a/lib${ln}.so"
          }

          build_core 0x1000 emucore_4k
          build_core 0x4000 emucore_16k

          # Verify library sizes
          for so in emucore_4k emucore_16k; do
            sz="$(fsizef "$WORK/lib-stage/lib/arm64-v8a/lib${so}.so")"
            echo "  lib${so}.so = $(( sz / 1024 / 1024 )) MB"
            [[ "$sz" -gt 10000000 ]] || { echo "FATAL: lib${so}.so too small ($sz bytes)" >&2; exit 1; }
          done

          # Merge APK: base = 4K APK, remove signatures and old .so files, add both new .so files (stored uncompressed)
          UNS="$WORK/universal-unsigned.apk"
          ALN="$WORK/universal-aligned.apk"
          cp -f "$WORK/base-emucore_4k.apk" "$UNS"
          zip -qd "$UNS" "META-INF/*" >/dev/null 2>&1 || true
          zip -qd "$UNS" "lib/arm64-v8a/libemucore_4k.so" "lib/arm64-v8a/libemucore_16k.so" >/dev/null 2>&1 || true
          ( cd "$WORK/lib-stage" && zip -qr -0 "$UNS" lib )
          "$ZIPALIGN" -f -P 16 4 "$UNS" "$ALN"

          cp -f "$ALN" "$OUTDIR/$FINAL_APK"
          rm -f "$WORK/base-*.apk"

          echo "FINAL_APK=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "OUTDIR=$OUTDIR" >> $GITHUB_OUTPUT
          echo "versionName=$VN" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR_INPUT" >> $GITHUB_OUTPUT
        env:
          DISCORD_SDK_DIR: ${{ env.DISCORD_SDK_DIR }}

      # ===== Sign the APK (only for release builds) =====
      - name: Sign release APK
        if: github.event.inputs.build_type == 'release'
        run: |
          set -e
          KEYSTORE_PATH="${HOME}/.android/release.keystore"
          KEY_ALIAS="armsx2-ci"
          # Use secrets – if not provided, fallback to temporary (not recommended for production)
          KS_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KS_PASSWORD" ]; then
            echo "WARNING: No keystore password secret set – using temporary insecure password." >&2
            KS_PASSWORD="armsx2-ci-temp"
            KEY_PASSWORD="armsx2-ci-temp"
          fi

          mkdir -p "${HOME}/.android"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating CI keystore for signing..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ARMSX2 CI, OU=CI, O=CI, L=CI, S=CI, C=US" \
              2>/dev/null
          fi

          BUILD_TOOLS_DIR="$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort -V | tail -1)"
          APK_PATH="${{ steps.build.outputs.OUTDIR }}/${{ steps.build.outputs.FINAL_APK }}"

          echo "Signing APK: ${APK_PATH}"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KS_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            "$APK_PATH"

          echo "Verifying signature..."
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "$APK_PATH"

      # ===== GitHub Release steps =====
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Delete previous nightly release and tag (if any)
        run: |
          set -e
          VN="${{ steps.build.outputs.versionName }}"
          # Match tags like "v2.0.0-build.123"
          TAG_PATTERN="${VN}-build.*"
          EXISTING_TAG=$(gh release list --json tagName -q ".[] | select(.tagName | test(\"${TAG_PATTERN}\")) | .tagName" | head -1)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Deleting existing release and tag: $EXISTING_TAG"
            gh release delete "$EXISTING_TAG" --yes || true
            git tag -d "$EXISTING_TAG" || true
            git push --delete origin "$EXISTING_TAG" || true
          else
            echo "No previous nightly release found for version $VN"
          fi

      - name: Create Git Tag
        id: create_tag
        run: |
          set -e
          VN="${{ steps.build.outputs.versionName }}"
          TAG="${VN}-build.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Nightly build ${{ github.run_number }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Nightly ${{ steps.create_tag.outputs.tag }}
          body: |
            ## ARMSX2 Android Nightly Build (Legacy – Dual Core)
            **This APK is the legacy build** (ARMv8.0 + outline atomics, minSdk 26) and includes both 4K and 16K page‑size cores.
            - Version: ${{ steps.build.outputs.versionName }}
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Short SHA: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
            - Flavor: ${{ steps.build.outputs.flavor }}
            - Build type: ${{ github.event.inputs.build_type }}
            - PGO: ${{ steps.build.outputs.pgo_enabled }}
          files: |
            ${{ steps.build.outputs.OUTDIR }}/${{ steps.build.outputs.FINAL_APK }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
