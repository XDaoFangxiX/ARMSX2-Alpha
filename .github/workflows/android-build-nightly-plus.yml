name: Android Build (Plus)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g., v2.0.0)'
        required: true
        type: string
        default: 'nightly'
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Build flavor (Github or Play)'
        required: false
        type: choice
        options:
          - Github
          - Play
        default: 'Github'

permissions:
  contents: write

jobs:
  android:
    name: Android APK (Dual Core)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null || true

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Set versionName in build.gradle.kts
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ github.event.inputs.versionName }}"/' app/build.gradle.kts

      - name: Set up Discord SDK
        run: |
          echo "DISCORD_SDK_DIR=${{ github.workspace }}/discord-sdk" >> $GITHUB_ENV
          # Add download commands here if the SDK needs to be fetched from somewhere

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== NEW: Dual‑core build with PGO =====
      - name: Build Dual‑Core APK with PGO
        id: build
        run: |
          set -e

          ROOT_DIR="${{ github.workspace }}/platforms/android"
          GRADLE="$ROOT_DIR/gradlew"
          cd "$ROOT_DIR"

          FLAVOR="${{ github.event.inputs.flavor }}"
          FLAVOR_LOWER="$(echo "${FLAVOR}" | tr '[:upper:]' '[:lower:]')"
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"

          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE_LOWER="$(echo "${BUILD_TYPE}" | tr '[:upper:]' '[:lower:]')"
          BUILD_TYPE_CAP="$(echo ${BUILD_TYPE:0:1} | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"

          # Version info
          VN="$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*?:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          VN="${VN:-nightly}"
          VC="${{ github.run_number }}"

          # PGO profile (adjust path if you have one)
          PROF="$ROOT_DIR/app/build/pgo.prof"

          # find zipalign
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set" >&2
            exit 1
          fi
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found" >&2
            exit 1
          fi
          echo "ZIPALIGN=$ZIPALIGN"

          # --- PGO: optimize when the profile exists, else fall back so CI never fails ---
          if [[ -f "$PROF" ]]; then
            PGO_ARGS=(-Parmsx2.pgo=optimize -Parmsx2.pgoProfile="$PROF")
            echo "PGO: optimize using $PROF ($(( $(wc -c < "$PROF") / 1024 / 1024 )) MB)"
          else
            PGO_ARGS=(-Parmsx2.pgo=none)
            echo "WARNING: PGO profile not found at $PROF — building PGO=none (slower core)." >&2
          fi

          WORK="$ROOT_DIR/app/build/nightly-dualcore"
          rm -rf "$WORK"
          mkdir -p "$WORK/lib-stage/lib/arm64-v8a" "$(dirname "$OUT")"
          BUILT="$ROOT_DIR/app/build/outputs/apk/${FLAVOR_LOWER}/release/app-${FLAVOR_LOWER}-release.apk"

          fsizef() { stat -c%s "$1" 2>/dev/null || stat -f%z "$1"; }   # Linux || macOS

          build_core() {
            local ps="$1" ln="$2"
            echo "=== core $ln (page=$ps, flavor=$FLAVOR) ==="
            rm -f "$BUILT"
            "$GRADLE" -p "$ROOT_DIR" ":app:assemble${FLAVOR_CAP}${BUILD_TYPE_CAP}" \
              -Parmsx2.hostPageSize="$ps" \
              -Parmsx2.nativeLibName="$ln" \
              "${PGO_ARGS[@]}" \
              -Parmsx2.versionCode="$VC" \
              -Parmsx2.versionName="$VN" \
              --stacktrace
            [[ -f "$BUILT" ]] || { echo "FATAL: gradle produced no APK for $ln ($BUILT)" >&2; exit 1; }
            unzip -l "$BUILT" "lib/arm64-v8a/lib${ln}.so" >/dev/null \
              || { echo "FATAL: lib${ln}.so missing from $BUILT" >&2; exit 1; }
            cp -f "$BUILT" "$WORK/base-${ln}.apk"
            unzip -p "$BUILT" "lib/arm64-v8a/lib${ln}.so" > "$WORK/lib-stage/lib/arm64-v8a/lib${ln}.so"
          }

          build_core 0x1000 emucore_4k
          build_core 0x4000 emucore_16k

          for so in emucore_4k emucore_16k; do
            sz="$(fsizef "$WORK/lib-stage/lib/arm64-v8a/lib${so}.so")"
            echo "  lib${so}.so = $(( sz / 1024 / 1024 )) MB"
            [[ "$sz" -gt 10000000 ]] || { echo "FATAL: lib${so}.so too small ($sz bytes)" >&2; exit 1; }
          done

          # --- merge: 4k APK as base, drop old signatures + both cores, re-add STORED ---
          UNS="$WORK/universal-unsigned.apk"
          ALN="$WORK/universal-aligned.apk"
          cp -f "$WORK/base-emucore_4k.apk" "$UNS"
          zip -qd "$UNS" "META-INF/*" >/dev/null 2>&1 || true
          zip -qd "$UNS" "lib/arm64-v8a/libemucore_4k.so" "lib/arm64-v8a/libemucore_16k.so" >/dev/null 2>&1 || true
          ( cd "$WORK/lib-stage" && zip -qr -0 "$UNS" lib )
          "$ZIPALIGN" -f -P 16 4 "$UNS" "$ALN"

          # Copy universal APK to the standard output folder (so the release step can find it)
          OUTDIR="$ROOT_DIR/app/build/outputs/apk/${FLAVOR_LOWER}/${BUILD_TYPE_LOWER}"
          mkdir -p "$OUTDIR"
          cp -f "$ALN" "$OUTDIR/app-${FLAVOR_LOWER}-${BUILD_TYPE_LOWER}-universal.apk"
          # Export path for verification and release
          echo "UNIVERSAL_APK=$OUTDIR/app-${FLAVOR_LOWER}-${BUILD_TYPE_LOWER}-universal.apk" >> $GITHUB_ENV

          # Optionally remove individual APKs to avoid clutter
          rm -f "$BUILT" "$WORK/base-*.apk"

          # Set outputs for later steps
          echo "FLAVOR_LOWER=${FLAVOR_LOWER}" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE_LOWER=${BUILD_TYPE_LOWER}" >> $GITHUB_OUTPUT
        env:
          DISCORD_SDK_DIR: ${{ env.DISCORD_SDK_DIR }}

      # ===== NEW: Verification step =====
      - name: Verify Universal APK
        run: |
          set -e
          APK="$UNIVERSAL_APK"
          if [ ! -f "$APK" ]; then
            echo "FATAL: APK not found at $APK" >&2
            exit 1
          fi
          echo "Verifying $APK"

          # Find tools in build-tools
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)

          if [ -z "$ZIPALIGN" ]; then echo "zipalign not found" >&2; exit 1; fi
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found" >&2; exit 1; fi

          echo "ZIPALIGN=$ZIPALIGN, APKSIGNER=$APKSIGNER"

          echo "================= VERIFY ================="
          echo "-- both cores present --"
          unzip -l "$APK" | grep -E "libemucore_(4k|16k)\.so" || { echo "FATAL: cores missing" >&2; exit 1; }

          echo "-- 16k alignment --"
          "$ZIPALIGN" -c -P 16 4 "$APK" && echo "  align OK"

          echo "-- signature --"
          "$APKSIGNER" verify "$APK" && echo "  sig OK"

          if [ -x "$AAPT" ]; then
            echo "-- package info --"
            "$AAPT" dump badging "$APK" 2>/dev/null | grep -E "package: name|versionCode|versionName" | head -2
          fi

          echo "NIGHTLY-DUALCORE-DONE"
        continue-on-error: false   # Fail the job if verification fails
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ===== Existing steps for release (unchanged) =====
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get previous release
        id: get_release
        run: |
          previous_release=$(gh release list --limit 1 --json tagName -q '.[].tagName')
          echo "previous_release=$previous_release" >> $GITHUB_ENV

      - name: Delete previous release
        if: env.previous_release != ''
        run: |
          gh release delete ${{ env.previous_release }} --yes

      - name: Check if previous tag exists
        id: check_tag
        run: |
          if [ ! -z "${{ env.previous_release }}" ] && git rev-parse ${{ env.previous_release }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_ENV
          else
            echo "tag_exists=false" >> $GITHUB_ENV
          fi

      - name: Delete previous tag
        if: env.tag_exists == 'true'
        run: |
          git tag -d ${{ env.previous_release }}
          git push --delete origin ${{ env.previous_release }}

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create Git Tag
        id: create_tag
        run: |
          VERSION_NAME="$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*?:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          VERSION_NAME="${VERSION_NAME:-nightly}"
          TAG="${VERSION_NAME}-build.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Nightly build ${{ github.run_number }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Nightly ${{ steps.create_tag.outputs.tag }}
          body: |
            ## ARMSX2 Android Nightly Build (Dual Core)
            **Note:** This build includes both 4K and 16K page size cores.
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Short SHA: ${{ env.short_sha }}
            - Triggered by: ${{ github.actor }}
            - Flavor: ${{ github.event.inputs.flavor }}
            - Build type: ${{ github.event.inputs.build_type }}
          files: |
            platforms/android/app/build/outputs/apk/${{ steps.build.outputs.FLAVOR_LOWER }}/${{ steps.build.outputs.BUILD_TYPE_LOWER }}/*.apk
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
