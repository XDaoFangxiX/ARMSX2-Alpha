name: Android Build (Legacy DualCore)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (e.g., v2.0.0)'
        required: true
        type: string
        default: 'nightly'
      build_type:
        description: "Build type"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'Build flavor (Github or Play)'
        required: false
        type: choice
        options:
          - Github
          - Play
          - Antutu
          - Ludashi
          - Pubg
        default: 'Github'

permissions:
  contents: write

jobs:
  android:
    name: Android APK (Dual Core)
    runs-on: ubuntu-24.04
    continue-on-error: true
    defaults:
      run:
        working-directory: platforms/android
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Install NDK 29 (used for the legacy target) and CMake
      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;29.0.14206865" "cmake;3.31.6" >/dev/null || true

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Fetch shaderc third-party deps
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Set versionName in build.gradle.kts
        run: |
          sed -i 's/versionName = ".*"/versionName = "${{ github.event.inputs.versionName }}"/' app/build.gradle.kts

      - name: Set up Discord SDK
        run: |
          echo "DISCORD_SDK_DIR=${{ github.workspace }}/discord-sdk" >> $GITHUB_ENV
          # Add download commands here if the SDK needs to be fetched from somewhere

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ===== Build the single legacy APK (dual‑core + PGO) =====
      - name: Build Legacy APK (dual‑core, PGO)
        id: build
        run: |
          set -e

          ROOT_DIR="${{ github.workspace }}/platforms/android"
          GRADLE="$ROOT_DIR/gradlew"
          cd "$ROOT_DIR"

          # Fixed parameters for the legacy target (safe for all ARMv8.0 devices)
          MINSDK=26
          NDK_VER="29.0.14206865"
          MARCH="armv8-a"
          MARCH_EXTRA="-moutline-atomics"

          # Version info
          VN="$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*?:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          VN="${VN:-nightly}"
          VC="${{ github.run_number }}"

          # PGO profile path (adjust if your build produces it elsewhere)
          PROF="$ROOT_DIR/pgo/armsx2.profdata"

          # find zipalign
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME not set" >&2
            exit 1
          fi
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found" >&2
            exit 1
          fi
          echo "ZIPALIGN=$ZIPALIGN"

          # --- PGO: use profile if available, else fall back to none ---
          if [[ -f "$PROF" ]]; then
            PGO_ARGS=(-Parmsx2.pgo=optimize -Parmsx2.pgoProfile="$PROF")
            echo "PGO: optimising using $PROF ($(( $(wc -c < "$PROF") / 1024 / 1024 )) MB)"
          else
            PGO_ARGS=(-Parmsx2.pgo=none)
            echo "WARNING: PGO profile not found at $PROF — building without PGO (slower core)." >&2
          fi

          # Working directory for assembling the two cores
          WORK="$ROOT_DIR/app/build/nightly-dualcore"
          rm -rf "$WORK"
          mkdir -p "$WORK/lib-stage/lib/arm64-v8a"

          # Final output APK name (updater‑compatible)
          FINAL_APK="ARMSX2-${VN}-legacy-armv8.0-sdk26.apk"
          OUTDIR="$ROOT_DIR/app/build/outputs/apk/legacy"
          mkdir -p "$OUTDIR"

          # Helper to get file size (Linux / macOS compatible)
          fsizef() { stat -c%s "$1" 2>/dev/null || stat -f%z "$1"; }

          build_core() {
            local ps="$1" ln="$2"
            echo "=== Building core: $ln (page size $ps) ==="

            # Gradle assemble – we force the legacy parameters for every core
            "$GRADLE" -p "$ROOT_DIR" ":app:assembleGithubRelease" \
              -Parmsx2.hostPageSize="$ps" \
              -Parmsx2.nativeLibName="$ln" \
              -Parmsx2.minSdk="$MINSDK" \
              -Parmsx2.ndkVersion="$NDK_VER" \
              -Parmsx2.march="$MARCH" \
              -Parmsx2.marchExtra="$MARCH_EXTRA" \
              "${PGO_ARGS[@]}" \
              -Parmsx2.versionCode="$VC" \
              -Parmsx2.versionName="$VN" \
              --stacktrace

            # Gradle writes the APK to app/build/outputs/apk/github/release/app-github-release.apk
            BUILT="$ROOT_DIR/app/build/outputs/apk/github/release/app-github-release.apk"
            [[ -f "$BUILT" ]] || { echo "FATAL: Gradle did not produce an APK for $ln" >&2; exit 1; }
            # Verify that the native library is inside
            unzip -l "$BUILT" "lib/arm64-v8a/lib${ln}.so" >/dev/null \
              || { echo "FATAL: lib${ln}.so missing from APK" >&2; exit 1; }

            # Save the base APK and extract the .so for later merging
            cp -f "$BUILT" "$WORK/base-${ln}.apk"
            unzip -p "$BUILT" "lib/arm64-v8a/lib${ln}.so" > "$WORK/lib-stage/lib/arm64-v8a/lib${ln}.so"
          }

          # Build the two cores with different page sizes
          build_core 0x1000 emucore_4k
          build_core 0x4000 emucore_16k

          # Sanity check: libraries should be large enough
          for so in emucore_4k emucore_16k; do
            sz="$(fsizef "$WORK/lib-stage/lib/arm64-v8a/lib${so}.so")"
            echo "  lib${so}.so = $(( sz / 1024 / 1024 )) MB"
            [[ "$sz" -gt 10000000 ]] || { echo "FATAL: lib${so}.so too small ($sz bytes)" >&2; exit 1; }
          done

          # --- Merge: use the 4K APK as base, remove old signatures and both .so files,
          # then add both freshly built .so files back (stored, not compressed) ---
          UNS="$WORK/universal-unsigned.apk"
          ALN="$WORK/universal-aligned.apk"
          cp -f "$WORK/base-emucore_4k.apk" "$UNS"
          zip -qd "$UNS" "META-INF/*" >/dev/null 2>&1 || true
          zip -qd "$UNS" "lib/arm64-v8a/libemucore_4k.so" "lib/arm64-v8a/libemucore_16k.so" >/dev/null 2>&1 || true
          ( cd "$WORK/lib-stage" && zip -qr -0 "$UNS" lib )
          "$ZIPALIGN" -f -P 16 4 "$UNS" "$ALN"

          # Move the final APK to the output directory with the required name
          cp -f "$ALN" "$OUTDIR/$FINAL_APK"

          # Clean up intermediate APKs
          rm -f "$WORK/base-*.apk"

          # Set outputs for later steps
          echo "FINAL_APK=$FINAL_APK" >> $GITHUB_OUTPUT
          echo "OUTDIR=$OUTDIR" >> $GITHUB_OUTPUT
          echo "versionName=$VN" >> $GITHUB_OUTPUT
        env:
          DISCORD_SDK_DIR: ${{ env.DISCORD_SDK_DIR }}

      # ===== Sign the APK (only for release builds) =====
      - name: Sign release APK
        if: github.event.inputs.build_type == 'release'
        run: |
          KEYSTORE_PATH="${HOME}/.android/release.keystore"
          KEY_ALIAS="${KEY_ALIAS:-armsx2-ci}"
          KS_PASSWORD="${KEYSTORE_PASSWORD:-armsx2-ci-temp}"
          KEY_PASSWORD="${KEY_PASSWORD:-armsx2-ci-temp}"

          mkdir -p "${HOME}/.android"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating CI keystore for signing..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=ARMSX2 CI, OU=CI, O=CI, L=CI, S=CI, C=US" \
              2>/dev/null
          fi

          BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME}/build-tools/"*/ | sort -V | tail -n 1)
          APK_PATH="${{ steps.build.outputs.OUTDIR }}/${{ steps.build.outputs.FINAL_APK }}"

          echo "Signing APK: ${APK_PATH}"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KS_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            "$APK_PATH"

          echo "Verifying signature..."
          "${BUILD_TOOLS_DIR}/apksigner" verify --verbose "$APK_PATH"

      # ===== GitHub Release steps (unchanged) =====
      - name: Set up GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Get previous release
        id: get_release
        run: |
          previous_release=$(gh release list --limit 1 --json tagName -q '.[].tagName')
          echo "previous_release=$previous_release" >> $GITHUB_ENV

      - name: Delete previous release
        if: env.previous_release != ''
        run: |
          gh release delete ${{ env.previous_release }} --yes

      - name: Check if previous tag exists
        id: check_tag
        run: |
          if [ ! -z "${{ env.previous_release }}" ] && git rev-parse ${{ env.previous_release }} >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_ENV
          else
            echo "tag_exists=false" >> $GITHUB_ENV
          fi

      - name: Delete previous tag
        if: env.tag_exists == 'true'
        run: |
          git tag -d ${{ env.previous_release }}
          git push --delete origin ${{ env.previous_release }}

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create Git Tag
        id: create_tag
        run: |
          VERSION_NAME="${{ steps.build.outputs.versionName }}"
          TAG="${VERSION_NAME}-build.${{ github.run_number }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Nightly build ${{ github.run_number }}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Nightly ${{ steps.create_tag.outputs.tag }}
          body: |
            ## ARMSX2 Android Nightly Build (Legacy – Dual Core)
            **This APK is the legacy build** (ARMv8.0 + outline atomics, minSdk 26) and includes both 4K and 16K page‑size cores.
            - Version: ${{ steps.build.outputs.versionName }}
            - Build number: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Short SHA: ${{ env.short_sha }}
            - Triggered by: ${{ github.actor }}
            - Flavor: ${{ github.event.inputs.flavor }}
            - Build type: ${{ github.event.inputs.build_type }}
            - PGO: ${{ (contains(github.event.head_commit.message, 'pgo') && 'enabled') || 'auto' }}
          files: |
            ${{ steps.build.outputs.OUTDIR }}/${{ steps.build.outputs.FINAL_APK }}
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
